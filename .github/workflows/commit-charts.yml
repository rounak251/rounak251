name: Commit charts

on:
  schedule:
    - cron: "30 18 * * *" # 00:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/commit_charts.py"
      - ".github/workflows/commit-charts.yml"

permissions:
  contents: write

concurrency:
  group: commit-charts
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/commit_charts.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "charts unchanged"
          else
            git commit -m "Update commit charts"
            git push
          fi
